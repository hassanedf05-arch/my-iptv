name: Auto IPTV Premium Hunter

on:
  schedule:
    - cron: '*/30 * * * *' # تشغيل تلقائي كل 30 دقيقة لضمان روابط طازجة
  workflow_dispatch: # يتيح لك التشغيل اليدوي بضغطة زر

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        [span_3](start_span)pip install requests urllib3 # تثبيت المكتبات اللازمة للفحص[span_3](end_span)

    - name: Run Premium Hunter
      run: python main.py
      [span_4](start_span)continue-on-error: true # لضمان استمرار العمل حتى لو فشل أحد المصادر[span_4](end_span)

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        [span_5](start_span)git add playlist.m3u index.html # إضافة ملف القنوات والواجهة[span_5](end_span)
        git commit -m "🚀 تحديث القنوات والـ Dashboard" || exit 0
        git push

